<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Late Night Incident Counter</title>
		<style>
			:root {
				color: #111;
				background: #f8d830;
				font-family: Helvetica, sans-serif;
			}

			body {
				box-sizing: border-box;
				margin: 0;
				min-block-size: 100vh;
				padding: clamp(1rem, 4vw, 3rem);
				display: grid;
				place-items: center;
				background: repeating-linear-gradient(
					135deg,
					transparent 0 2rem,
					rgb(0 0 0 / 4%) 2rem 4rem
				);
			}

			main {
				box-sizing: border-box;
				width: min(100%, 48rem);
				border: clamp(0.5rem, 1.5vw, 0.85rem) solid #111;
				padding: clamp(1.5rem, 6vw, 5rem);
				text-align: center;
				background: #f8d830;
				box-shadow: 0.6rem 0.6rem #111;
			}

			.eyebrow {
				margin: 0;
				font-size: clamp(0.8rem, 2vw, 1rem);
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}

			h1 {
				margin: 1rem 0 0;
				font-size: clamp(3.5rem, 18vw, 11rem);
				line-height: 0.85;
				letter-spacing: -0.07em;
			}

			#day-count {
				display: block;
			}

			.description {
				margin: 1rem 0 2rem;
				font-size: clamp(1.1rem, 3vw, 1.6rem);
				font-weight: 700;
			}

			#status,
			#updated-at {
				margin: 0.75rem 0;
			}

			.navigation {
				margin-top: 5rem;
				display: flex;
				justify-content: space-between;
			}

			a {
				color: inherit;
				font-weight: 700;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="eyebrow">Late Night Incident Counter</p>
			<h1><span id="day-count">...</span> days</h1>
			<p class="description">since I stayed up past midnight</p>
			<p id="updated-at">&nbsp;</p>
			<p id="status" role="status" aria-live="polite">
				Checking the incident log...
			</p>
			<p class="navigation">
				<a href="/sites/">Back to mini sites</a>
				<a href="https://gist.github.com/aciccarello/052851f67f7a66f12ad8020410e2761c/edit">Update the incident log</a>
			</p>
		</main>
		<script type="module" src="./index.js"></script>
	</body>
</html>
